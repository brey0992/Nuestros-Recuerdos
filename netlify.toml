# Configuración para Netlify: arma la página con Vite y publica la carpeta dist
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Las fotos casi nunca cambian: el navegador las guarda una semana
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
